<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceuta No Se Apaga</title>
  
  <!-- SEO & Metatags minimalistas (sin pistas sobre el evento) -->
  <meta name="description" content="Ceuta No Se Apaga. Frecuencia oficial.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://ceutanoseapaga.com">

  <!-- OpenGraph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ceutanoseapaga.com">
  <meta property="og:title" content="Ceuta No Se Apaga">
  <meta property="og:description" content="Ceuta No Se Apaga.">

  <!-- Favicon SVG sutil -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23050505'/%3E%3Ccircle cx='50' cy='50' r='12' fill='%239E1B1B'/%3E%3C/svg%3E">

  <!-- Hojas de Estilo -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/teaser.css">
</head>
<body class="teaser-body">

  <!-- Capas Atmosféricas Cinemáticas (CRT Scanlines y Grano Analógico) -->
  <div class="crt-overlay" aria-hidden="true"></div>
  <div class="film-grain" aria-hidden="true"></div>

  <!-- BARRA DE NAVEGACIÓN MINIMALISTA -->
  <header class="site-header teaser-nav" id="site-header" role="banner">
    <div class="container nav-container" style="justify-content: space-between;">
      <!-- Brand Logo Tipográfico Puro (sin iconos que den pistas) -->
      <a href="#" class="brand-logo" id="brand-logo-trigger" aria-label="Ceuta No Se Apaga">
        <span class="brand-signal-dot" aria-hidden="true"></span>
        <div class="brand-info">
          <span class="brand-title">CEUTA NO SE APAGA</span>
          <span class="brand-meta">SEÑAL EN ESPERA</span>
        </div>
      </a>

      <!-- Acciones de Navegación: Sonido Ambiental -->
      <div class="nav-actions">
        <button type="button" class="btn-soundscape" id="btn-soundscape-toggle" aria-label="Activar o silenciar paisaje sonoro ambiental">
          <div class="soundscape-bars" aria-hidden="true">
            <span class="soundscape-bar"></span>
            <span class="soundscape-bar"></span>
            <span class="soundscape-bar"></span>
            <span class="soundscape-bar"></span>
          </div>
          <span class="soundscape-label">Paisaje Sonoro</span>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL ENIGMÁTICO Y MINIMALISTA -->
  <main id="main-content">
    <section class="teaser-hero" aria-labelledby="teaser-main-title">
      <div class="hero-backdrop" aria-hidden="true"></div>
      <canvas id="hero-canvas" aria-hidden="true"></canvas>

      <div class="container teaser-content">
        <!-- Indicador de señal en espera -->
        <div class="teaser-badge">
          <span class="teaser-badge-dot" aria-hidden="true"></span>
          <span>SEÑAL EN ESPERA</span>
        </div>

        <!-- Titular Principal -->
        <h1 class="teaser-title" id="teaser-main-title">
          CEUTA NO SE <span>APAGA</span>
        </h1>

        <!-- Divisor sutil carmesí -->
        <div class="teaser-divider" aria-hidden="true">
          <span class="divider-line"></span>
          <span class="divider-gem"></span>
          <span class="divider-line"></span>
        </div>

        <!-- Mensaje escueto e intrigante sin revelar fecha, lugar ni temática -->
        <p class="teaser-status">
          Próximamente
        </p>

        <p class="teaser-substatus">
          Frecuencia en emisión de prueba.
        </p>
      </div>
    </section>
  </main>

  <!-- PIE DE PÁGINA ULTRA-MINIMALISTA -->
  <footer class="teaser-footer" role="contentinfo">
    <div class="container teaser-footer-container">
      <span class="teaser-copy" id="footer-secret-trigger">© 2026 CEUTA NO SE APAGA</span>
      <span class="teaser-status-tag">// EMISIÓN 00.0</span>
    </div>
  </footer>

  <!-- Scripts Modulares -->
  <script src="js/soundscape.js"></script>
  <script src="js/teaser.js"></script>
</body>
</html>
